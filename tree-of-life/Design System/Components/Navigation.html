<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>القوائم والتنقل – شجرة الحياة</title>
  <link rel="stylesheet" href="../../css/brand-system.css">
  <link rel="stylesheet" href="../../css/app-ui.css">
  <style>
    body { padding: 40px; background-color: var(--color-beige-light); font-family: 'Cairo', sans-serif; }
    .nav-demo-wrap { display: flex; flex-direction: column; gap: 30px; }
  </style>
</head>
<body>
  <h1>قوائم التنقل (Navigation Components) 🧭</h1>
  
  <div class="nav-demo-wrap">
    <!-- Header Demo -->
    <h3>1. ترويسة التطبيق المصغرة (App Mini Header)</h3>
    <div class="app-header" style="border: 1px solid var(--color-beige-dark); border-radius: 12px; padding: 10px 20px;">
      <div class="app-brand">
        <span>🌳</span>
        <span class="app-brand-name">شجرة الحياة</span>
      </div>
      <div class="app-notification-icon">🔔</div>
    </div>
    
    <!-- Tab Controls Demo -->
    <h3>2. أزرار تبديل المحتوى (Tab Control Buttons)</h3>
    <div class="toggle-group" style="max-width: 400px;">
      <button class="toggle-btn active">لوحة A2 الكبرى</button>
      <button class="toggle-btn">لوحة A3 المدمجة</button>
    </div>
  </div>
</body>
</html>
