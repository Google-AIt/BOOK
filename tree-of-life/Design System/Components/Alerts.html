<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>التنبيهات – شجرة الحياة</title>
  <link rel="stylesheet" href="../../css/brand-system.css">
  <link rel="stylesheet" href="../../css/app-ui.css">
  <style>
    body { padding: 40px; background-color: var(--color-beige-light); font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; gap: 20px; }
  </style>
</head>
<body>
  <h1>التنبيهات والإشعارات العائمة (Alerts & Toasts) 🔔</h1>
  
  <!-- Success Toast -->
  <div class="ui-kit-toast ui-kit-toast-success" style="max-width: 400px;">
    <span>✨</span>
    <div>
      <div style="font-weight: 700; color: var(--color-green-dark);">تم إضافة ورقة الذاكرة بنجاح!</div>
      <p style="font-size: 0.7rem; opacity: 0.8; margin-top: 2px;">تم تعليق ورقتها على الغصن الأيمن لشجرة عائلتكم.</p>
    </div>
  </div>
  
  <!-- Normal Toast -->
  <div class="ui-kit-toast" style="max-width: 400px; border-right-color: var(--color-khairukum-pink);">
    <span>❤️</span>
    <div>
      <div style="font-weight: 700; color: var(--color-green-dark);">قفل الوضع الخاص نشط</div>
      <p style="font-size: 0.7rem; opacity: 0.8; margin-top: 2px;">تصفح ذكريات عائلتك محمي حالياً بالرمز السري.</p>
    </div>
  </div>
</body>
</html>
