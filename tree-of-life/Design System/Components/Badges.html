<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الشارات – شجرة الحياة</title>
  <link rel="stylesheet" href="../../css/brand-system.css">
  <link rel="stylesheet" href="../../css/app-ui.css">
  <style>
    body { padding: 40px; background-color: var(--color-beige-light); font-family: 'Cairo', sans-serif; }
    .badge-demo-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>الشارات وملصقات التصنيف (Badge & Tag Components) 🏷️</h1>
  
  <div class="badge-demo-row">
    <!-- Love category tag -->
    <span class="ui-kit-badge" style="background-color: var(--color-khairukum-pink-soft); color: var(--color-khairukum-pink);">❤️ حب ومودة</span>
    
    <!-- Travel category tag -->
    <span class="ui-kit-badge" style="background-color: #F0F4F8; color: #5C7F9E;">✈️ سفر وسياحة</span>
    
    <!-- Growth category tag -->
    <span class="ui-kit-badge" style="background-color: #F4F8F3; color: #5C6B57;">🌱 نمو وتطوير</span>
    
    <!-- Notification badge -->
    <div style="position: relative; display: inline-block;">
      <span>صندوق الوارد</span>
      <span class="sidebar-user-avatar" style="position: absolute; top: -8px; left: -12px; width: 18px; height: 18px; font-size: 0.65rem; background-color: var(--color-khairukum-pink); color: white;">3</span>
    </div>
  </div>
</body>
</html>
