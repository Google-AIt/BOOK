<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بانرات المواقع والمتاجر – شجرة الحياة</title>
  <link rel="stylesheet" href="../css/brand-system.css">
  <link rel="stylesheet" href="../css/app-ui.css">
  <style>
    body { padding: 40px; background-color: var(--color-beige-light); font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; gap: 30px; }
    .banner-row {
      width: 100%;
      max-width: 900px;
      height: 250px;
      background-color: var(--color-white);
      border: 1px solid var(--color-beige-dark);
      border-radius: 20px;
      box-shadow: var(--paper-shadow);
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>بانرات المتاجر الرقمية (E-commerce & Store Banners) 💻</h1>
  <p>نماذج الصور الرئيسية وبانرات الإعلانات على منصات بيع الهدايا مثل Amazon و Etsy:</p>
  
  <div class="banner-row">
    <!-- Image placeholder -->
    <div style="background-color: var(--color-beige-medium); display: flex; align-items: center; justify-content: center; font-size: 3rem;">
      🌳📦
    </div>
    
    <!-- Text area -->
    <div style="padding: 40px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span class="ui-kit-badge" style="background-color: var(--color-khairukum-pink-soft); color: var(--color-khairukum-pink);">هدية زفاف ممتازة 💍</span>
        <h2 style="font-family: 'Reem Kufi', sans-serif; font-size: 1.4rem; color: var(--color-green-dark); margin: 0;">شجرة الحياة: تحفة الذكريات العائلية</h2>
        <p style="font-size: 0.75rem; opacity: 0.8;">الهدية الأكثر تعبيراً وخلوداً لتوثيق أثمن اللحظات وتخليد مسيرة المودة.</p>
      </div>
      
      <button class="ui-kit-btn ui-kit-btn-gold">اشتري الآن | من منصة خيركم 🛍️</button>
    </div>
  </div>
</body>
</html>
