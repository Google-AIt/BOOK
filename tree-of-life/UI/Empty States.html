<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحتكم فارغة – شجرة الحياة</title>
  <link rel="stylesheet" href="../css/brand-system.css">
  <link rel="stylesheet" href="../css/app-ui.css">
  <style>
    body {
      background-color: var(--color-beige-light);
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .empty-state-card {
      background-color: var(--color-white);
      border: 1px solid var(--color-beige-dark);
      border-radius: 24px;
      padding: 60px 40px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      box-shadow: var(--luxury-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }
    .empty-graphic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: var(--color-beige-medium);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      border: 1px dashed var(--gold-primary);
      box-shadow: var(--paper-shadow);
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="empty-state-card">
    <div class="empty-graphic">🌳</div>
    
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h1 style="font-family: 'Reem Kufi', sans-serif; color: var(--color-green-dark); margin: 0; font-size: 1.6rem;">شجرتكم وارفة.. بانتظار أوراقكم الأولى</h1>
      <p style="font-size: 0.85rem; opacity: 0.8; line-height: 1.7; max-width: 420px; margin: 0 auto;">
        لوحة الذكريات والأهداف المشتركة فارغة حالياً. ابدؤوا بكتابة أول ورقة مودة أو هدف عائلي لتبدأ شجرتكم بالنمو والازدهار.
      </p>
    </div>
    
    <div style="display: flex; gap: 15px; justify-content: center; width: 100%;">
      <button class="ui-kit-btn ui-kit-btn-outline" onclick="window.location.href='../index.html';">تصفح الدليل الإرشادي 📖</button>
      <button class="ui-kit-btn ui-kit-btn-gold" onclick="window.location.href='../index.html#customizer';">أضف أول ورقة الآن 🍃</button>
    </div>
  </div>
</body>
</html>
